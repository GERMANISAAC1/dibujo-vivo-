<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>Dibujo Vivo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: one-screen studio. A light table holds a pegged animation sheet; the tool tray sits below and swaps between Dibujar and Dar vida. */
:root{
  --table:#E7ECF4; --glow:#F6F8FD; --bar:#FFFFFF; --bar2:#F1F4F9;
  --ink:#15181F; --ink2:#586172; --line:#D3D9E4;
  --accent:#2B59FF; --accent-ink:#FFFFFF; --danger:#D93B2B;
  --f-display:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --f-hand:'Caveat','Segoe Print','Bradley Hand',cursive;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --table:#0D1017; --glow:#1A2030; --bar:#161A23; --bar2:#1E2330;
    --ink:#ECEFF6; --ink2:#9BA4B6; --line:#2A3142;
    --accent:#6F8CFF; --accent-ink:#0D1017; --danger:#F0604F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --table:#0D1017; --glow:#1A2030; --bar:#161A23; --bar2:#1E2330;
  --ink:#ECEFF6; --ink2:#9BA4B6; --line:#2A3142;
  --accent:#6F8CFF; --accent-ink:#0D1017; --danger:#F0604F;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--table);color:var(--ink);font:14px/1.4 var(--f-body);overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bar);border-bottom:1px solid var(--line)}
h1{margin:0;font:800 21px/1 var(--f-display);letter-spacing:-.02em;white-space:nowrap}
.seg{display:flex;gap:2px;padding:3px;background:var(--bar2);border:1px solid var(--line);border-radius:999px}
.seg button{border:0;background:transparent;color:var(--ink2);font:600 13px var(--f-body);padding:8px 14px;border-radius:999px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.stage{touch-action:none;position:relative;flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,var(--glow),var(--table) 72%)}
.sheet{transform-origin:center center;position:relative;background:#fff;border-radius:4px;padding-top:26px;box-shadow:0 1px 0 rgba(0,0,0,.05),0 14px 32px -14px rgba(15,25,55,.45)}
.hole{position:absolute;top:8px;background:var(--table);box-shadow:inset 0 1px 2px rgba(0,0,0,.28)}
.h1{left:24%;width:11px;height:11px;border-radius:50%}
.h2{left:50%;transform:translateX(-50%);width:34px;height:11px;border-radius:6px}
.h3{right:24%;width:11px;height:11px;border-radius:50%}
canvas#cv{display:block;touch-action:none;cursor:crosshair;-webkit-touch-callout:none}
.note{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);max-width:calc(100% - 32px);padding:7px 13px;border-radius:999px;background:var(--ink);color:var(--bar);font-size:12.5px;font-weight:500;text-align:center;pointer-events:none}

.panel{display:flex;flex-direction:column;gap:9px;padding-top:10px;padding-bottom:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bar);border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.tools{justify-content:space-between;gap:2px;overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tool{width:34px;height:36px;flex:none;display:grid;place-items:center;border:0;border-radius:13px;background:transparent;color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tool:disabled{opacity:.3;cursor:default}
.tool.armed{background:var(--danger);color:#fff}
.sep{width:1px;height:24px;background:var(--line);flex:none}
.i svg{display:block;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.i svg .fill{fill:currentColor}

.opts{justify-content:space-between;gap:14px}
.swatches{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,24px);grid-auto-columns:24px;gap:6px;flex:1 1 0;min-width:0;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;padding:5px 5px}
.swatches::-webkit-scrollbar{display:none}
.sw{width:24px;height:24px;flex:none;border-radius:50%;border:0;padding:0;box-shadow:inset 0 0 0 1px rgba(128,128,128,.35)}
.sw-custom{position:relative;display:block;background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);cursor:pointer}
.sw-custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bar),0 0 0 4px var(--ink)}
.size{display:flex;align-items:center;gap:8px;flex:0 0 118px;min-width:0}
.dotbox{width:28px;height:28px;flex:none;display:grid;place-items:center}
.dot{border-radius:50%;background:var(--ink)}
input[type=range]{flex:1;min-width:0;width:100%;accent-color:var(--accent);margin:0;height:28px}

.frames{align-items:stretch}
.strip{flex:1;min-width:0;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;padding:3px 2px}
.strip::-webkit-scrollbar{display:none}
.fr{position:relative;flex:none;width:44px;height:58px;padding:0;border:2px solid var(--line);border-radius:6px;background:#fff;overflow:hidden}
.fr canvas{display:block;width:100%;height:100%}
.fr span{position:absolute;left:2px;bottom:2px;padding:0 3px;border-radius:3px;background:rgba(255,255,255,.85);color:#586172;font:500 10px/14px var(--f-mono)}
.fr[aria-current="true"]{border-color:var(--accent)}
.fr.add{display:grid;place-items:center;border-style:dashed;background:transparent;color:var(--ink2)}
.fctl{display:flex;flex-direction:column;gap:6px;flex:none;justify-content:center}
.mini{width:32px;height:26px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--bar2);padding:0}
.mini .i svg{width:16px;height:16px}
.mini:disabled{opacity:.3}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 15px;border:1px solid var(--line);border-radius:999px;background:var(--bar2);font:600 14px var(--f-display)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fxdesc{margin:0;color:var(--ink2);font:400 12px/1.4 var(--f-mono);min-height:17px}
.ctrl{gap:10px}
.switch{display:flex;align-items:center;gap:8px;flex:none;border:0;background:transparent;padding:4px 2px;font-weight:600;font-size:13px}
.knob{position:relative;width:36px;height:22px;border-radius:999px;background:var(--line);transition:background .15s}
.knob::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.switch[aria-pressed="true"] .knob{background:var(--accent)}
.switch[aria-pressed="true"] .knob::after{transform:translateX(14px)}
.speed{flex:1;min-width:0;display:flex;flex-direction:column;gap:0;font-size:12px;color:var(--ink2)}
.speed b{font:500 12px var(--f-mono);color:var(--ink)}
.sw3{flex-wrap:wrap;justify-content:space-between;gap:4px 10px}


.facerow,.textrow{align-items:center}
.facerow{overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
.facerow::-webkit-scrollbar{display:none}
.facerow .chip{padding:7px 12px;font-size:13px}
.chip.quiet{background:transparent;color:var(--ink2)}
.textrow{gap:8px}
input[type=text]{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bar2);color:var(--ink);font:600 22px/1 var(--f-hand);-webkit-user-select:text;user-select:text}
.tbtn{flex:none;height:40px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--bar2);font:600 13px var(--f-body)}
#p-draw[data-tool="face"] .frames,#p-draw[data-tool="text"] .frames,#p-draw[data-tool="photo"] .frames,#p-draw[data-tool="photo"] .opts{display:none}
.photorow{flex-direction:column;align-items:stretch;gap:6px}
.photorow .chips{padding:2px}
.photorow .chip{padding:7px 12px;font-size:13px}
.photorow .speed{flex:none}

.fbar{display:none;position:absolute;z-index:2;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:10px;align-items:center;gap:6px;padding:6px;border-radius:20px;background:var(--bar);border:1px solid var(--line);box-shadow:0 10px 26px -10px rgba(0,0,0,.4)}
.fbar .chips{flex:1;min-width:0}
.fidx{position:absolute;z-index:1;top:12px;left:50%;transform:translateX(-50%);padding:5px 12px;border-radius:999px;background:var(--ink);color:var(--bar);font:500 12px var(--f-mono);letter-spacing:.04em;pointer-events:none;white-space:nowrap}
.app.full .fbar{display:flex}
.app.full .top{display:none}
.app.full #p-draw,.app.full #p-live{display:none}
.app.full .stage{padding-bottom:72px}
.app.full .note{bottom:82px}

.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.fab{position:absolute;z-index:2;top:10px;right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:6px}
.fab .tool{width:40px;height:40px;background:var(--bar);border:1px solid var(--line);box-shadow:0 6px 16px -8px rgba(0,0,0,.4)}
.app.full .fab{display:none}
.zoomctl{position:absolute;z-index:2;left:max(10px,env(safe-area-inset-left,0px));bottom:10px;display:flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:var(--bar);border:1px solid var(--line);box-shadow:0 6px 16px -8px rgba(0,0,0,.4)}
.zoomctl .tool{width:36px;height:36px;border-radius:50%}
.zlabel{min-width:48px;height:36px;border:0;background:transparent;color:var(--ink);font:500 12px var(--f-mono);padding:0 4px}
.app.full .zoomctl{display:none}
.galrow{flex-direction:column;align-items:stretch;gap:6px}
.galrow .chips{padding:2px}
.gal{flex:none;width:68px;padding:4px 4px 3px;border:1px solid var(--line);border-radius:12px;background:#fff;display:grid;justify-items:center;gap:2px;font:600 11px var(--f-body);color:#586172}
.gal img{width:56px;height:68px;object-fit:contain;display:block;pointer-events:none}
#galact .chip{padding:7px 12px;font-size:13px}
#p-draw[data-tool="gal"] .frames,#p-draw[data-tool="gal"] .opts{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <h1>Dibujo Vivo</h1>
    <div class="seg" role="group" aria-label="Modo">
      <button id="m-draw" type="button" aria-pressed="true">Dibujar</button>
      <button id="m-live" type="button" aria-pressed="false">Dar vida</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="sheet" id="sheet">
      <span class="hole h1"></span><span class="hole h2"></span><span class="hole h3"></span>
      <canvas id="cv" aria-label="Lienzo de dibujo"></canvas>
    </div>
    <div class="fab" id="fab">
      <button class="tool" id="b-save" type="button" aria-label="Descargar dibujo"><span class="i" data-i="download"></span></button>
      <button class="tool" id="b-share" type="button" aria-label="Compartir dibujo"><span class="i" data-i="share"></span></button>
    </div>
    <div class="zoomctl" id="zoomctl" role="group" aria-label="Zoom">
      <button class="tool" id="z-out" type="button" aria-label="Alejar"><span class="i" data-i="zoomout"></span></button>
      <button class="zlabel" id="z-reset" type="button" aria-label="Restablecer zoom">100%</button>
      <button class="tool" id="z-in" type="button" aria-label="Acercar"><span class="i" data-i="zoomin"></span></button>
      <button class="tool" id="z-hand" type="button" aria-pressed="false" aria-label="Mover el lienzo con un dedo"><span class="i" data-i="hand"></span></button>
    </div>
    <div class="note" id="note" role="status" aria-live="polite" hidden></div>
    <div class="fidx" id="fidx" hidden></div>
    <div class="fbar" id="fbar">
      <button class="tool" id="f-play" type="button" aria-label="Pausar"><span class="i" data-i="pause"></span></button>
      <div class="chips" id="fchips" role="group" aria-label="Movimiento"></div>
      <button class="tool" id="f-exit" type="button" aria-label="Salir de pantalla completa"><span class="i" data-i="x"></span></button>
    </div>
  </main>


  <section class="panel" id="p-draw" data-tool="pen" aria-label="Herramientas de dibujo">
    <div class="row tools">
      <button class="tool" id="t-pen" type="button" aria-pressed="true" aria-label="Lápiz"><span class="i" data-i="pencil"></span></button>
      <button class="tool" id="t-er" type="button" aria-pressed="false" aria-label="Borrador"><span class="i" data-i="eraser"></span></button>
      <button class="tool" id="t-fill" type="button" aria-pressed="false" aria-label="Balde: rellenar con color"><span class="i" data-i="bucket"></span></button>
      <button class="tool" id="t-face" type="button" aria-pressed="false" aria-label="Ojos y caras"><span class="i" data-i="face"></span></button>
      <button class="tool" id="t-text" type="button" aria-pressed="false" aria-label="Texto a mano"><span class="i" data-i="type"></span></button>
      <button class="tool" id="t-photo" type="button" aria-pressed="false" aria-label="Foto: quitar fondo"><span class="i" data-i="image"></span></button>
      <button class="tool" id="t-gal" type="button" aria-pressed="false" aria-label="Galería de figuras para pintar"><span class="i" data-i="grid"></span></button>
      <span class="sep"></span>
      <button class="tool" id="t-undo" type="button" aria-label="Deshacer"><span class="i" data-i="undo"></span></button>
      <button class="tool" id="t-redo" type="button" aria-label="Rehacer"><span class="i" data-i="redo"></span></button>
      <span class="sep"></span>
      <button class="tool" id="t-onion" type="button" aria-pressed="true" aria-label="Papel cebolla"><span class="i" data-i="layers"></span></button>
      <button class="tool" id="t-clear" type="button" aria-label="Limpiar cuadro"><span class="i" data-i="trash"></span></button>
    </div>
    <div class="row opts">
      <div class="swatches" id="sw"></div>
      <div class="size">
        <span class="dotbox"><span class="dot" id="dot"></span></span>
        <input id="size" type="range" min="3" max="28" value="7" aria-label="Grosor del trazo">
      </div>
    </div>
    <div class="row facerow chips" id="facerow" role="group" aria-label="Tipo de cara" hidden></div>
    <div class="row facerow chips" id="erow" role="group" aria-label="Qué borrar" hidden></div>
    <div class="row photorow" id="photorow" hidden>
      <div class="chips" id="phchips" role="group" aria-label="Foto">
        <button class="chip" id="ph-up" type="button">Subir foto</button>
        <button class="chip" id="ph-wand" type="button" aria-pressed="true">Varita</button>
        <button class="chip" id="ph-lasso" type="button" aria-pressed="false">Recortar</button>
        <button class="chip" id="ph-move" type="button" aria-pressed="false">Mover</button>
        <button class="chip quiet" id="ph-undo" type="button">Deshacer</button>
        <button class="chip quiet" id="ph-del" type="button">Quitar foto</button>
      </div>
      <label class="speed" id="phs"><span id="phl">Tolerancia</span> <b id="phv">30</b><input id="phr" type="range" min="5" max="80" value="30"></label>
      <input id="phfile" class="vh" type="file" accept="image/*,.webp,.jpg,.jpeg,.png,.gif,.bmp,.svg,.avif" tabindex="-1">
    </div>
    <div class="row textrow" id="textrow" hidden>
      <input id="txt" type="text" maxlength="40" placeholder="Escribe aquí" autocomplete="off" aria-label="Texto">
      <button class="tbtn" id="txt-del" type="button">Borrar</button>
    </div>
    <div class="row galrow" id="galrow" hidden>
      <div class="chips" id="galchips" role="group" aria-label="Galería de figuras"></div>
      <label class="speed" id="edl"><span>Detalle del contorno <b id="edv">50</b></span><input id="edr" type="range" min="5" max="100" value="50"></label>
      <div class="chips" id="galact">
        <button class="chip" id="g-up" type="button">Subir figura</button>
        <button class="chip" id="g-pdf" type="button">Subir PDF</button>
        <button class="chip quiet" id="g-off" type="button">Quitar figura</button>
        <button class="chip quiet" id="g-clr" type="button">Borrar las mías</button>
        <input id="pdffile" class="vh" type="file" accept="application/pdf,.pdf" tabindex="-1">
        <input id="gfile" class="vh" type="file" accept="image/*,.webp,.jpg,.jpeg,.png,.gif,.bmp,.svg,.avif" tabindex="-1">
      </div>
    </div>
    <div class="row frames">
      <div class="strip" id="strip" aria-label="Cuadros"></div>
      <div class="fctl">
        <button class="mini" id="f-dup" type="button" aria-label="Cuadro en blanco"><span class="i" data-i="blank"></span></button>
        <button class="mini" id="f-del" type="button" aria-label="Eliminar cuadro"><span class="i" data-i="trash"></span></button>
      </div>
    </div>
  </section>

  <section class="panel" id="p-live" aria-label="Controles de animación" hidden>
    <div class="chips" id="chips" role="group" aria-label="Movimiento"></div>
    <p class="fxdesc" id="fxdesc"></p>
    <div class="row sw3">
      <button class="switch" id="l-smile" type="button" aria-pressed="true"><span class="knob"></span><span>Sonreír</span></button>
      <button class="switch" id="l-eyes" type="button" aria-pressed="true"><span class="knob"></span><span>Mover ojos</span></button>
      <button class="switch" id="l-boil" type="button" aria-pressed="true"><span class="knob"></span><span>Línea viva</span></button>
      <button class="switch" id="l-cycle" type="button" aria-pressed="true"><span class="knob"></span><span>Pasar cuadros</span></button>
    </div>
    <label class="speed" id="fdrow" hidden><span>Tiempo por cuadro <b id="fdv">0.6 s</b></span><input id="fdur" type="range" min="0.1" max="3" step="0.1" value="0.6"></label>
    <div class="row ctrl">
      <button class="tool" id="l-play" type="button" aria-label="Pausar"><span class="i" data-i="pause"></span></button>
      <button class="tool" id="l-full" type="button" aria-label="Pantalla completa"><span class="i" data-i="expand"></span></button>
      <label class="speed"><span>Velocidad <b id="spv">1.0×</b></span><input id="speed" type="range" min="0.5" max="2" step="0.1" value="1"></label>
    </div>
  </section>
</div>

<script>
(function(){
  var W=900,H=1200,MAXF=24,KEY='dibujo-vivo-v1';
  var $=function(id){return document.getElementById(id);};
  var cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage'),note=$('note'),strip=$('strip');

  var ICONS={
    pencil:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
    eraser:'<path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/>',
    zoomin:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M11 8v6M8 11h6"/>',
    zoomout:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/>',

  function drawFace(c,map,st,face){
    var A=affineAt(map,face.x,face.y),lx=st.lx,ly=st.ly;
    if(map){
      var det=A.a*A.d-A.b*A.c,mg=Math.hypot(lx,ly);
      if(Math.abs(det)>.02&&mg>0){
        var nx=(A.d*lx-A.c*ly)/det,ny=(-A.b*lx+A.a*ly)/det,nm=Math.hypot(nx,ny)||1;
        lx=nx/nm*mg;ly=ny/nm*mg;
      }
    }
    var s=face.s,k=face.k||'persona',lw=7*clamp(s,.6,1.3)/s,ink='#15181F';
    c.save();c.transform(A.a,A.b,A.c,A.d,A.e,A.f);c.scale(s,s);
    c.lineCap='round';c.lineJoin='round';c.globalAlpha=1;c.lineWidth=lw;c.strokeStyle=ink;
    if(face.v==='p'){if(face.fl){c.scale(-1,1);lx=-lx;}drawProfile(c,k,st,lw,ink,lx,ly);c.restore();return;}
    if(k!=='ojos')faceBack(c,k);
    var ex=36,ey=-4,er=21,eh=Math.max(2,25*(1-st.blink));
    for(var q=-1;q<=1;q+=2){
      var x=q*ex;
      c.strokeStyle=ink;c.lineWidth=lw;
      if(st.blink>.85){
        c.beginPath();c.moveTo(x-er,ey);c.lineTo(x+er,ey);c.stroke();
      }else{
        c.beginPath();c.ellipse(x,ey,er,eh,0,0,6.2832);c.fillStyle='#fff';c.fill();c.stroke();
        var pr=Math.min(10,eh*.8),
            px=x+lx*Math.max(0,er-pr-lw/2),
            py=ey+ly*Math.max(0,eh-pr-lw/2);
        c.beginPath();c.arc(px,py,pr,0,6.2832);c.fillStyle=ink;c.fill();
        c.beginPath();c.arc(px-pr*.35,py-pr*.35,Math.max(1,pr*.3),0,6.2832);c.fillStyle='#fff';c.fill();
      }
    }
    if(k!=='ojos')faceFront(c,k,st.smile,lw,ink);
    c.restore();
  }
  function base(){ctx.setTransform(rk,0,0,rk,0,0);}
  function paper(){base();ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);}

  function render(){
    paper();
    drawBg(ctx,frames[cur]);
    pics.forEach(function(P,i){drawPic(ctx,P,null,tool==='photo'&&mode==='draw'&&i===selPic);});
    if(tool==='photo'&&mode==='draw'&&selPic>=0&&pics[selPic]&&phMode==='move'){
      var P0=pics[selPic],hw=P0.c.width*P0.s/2,hh=P0.c.height*P0.s/2;
      ctx.save();ctx.setLineDash([8,6]);ctx.strokeStyle='rgba(43,89,255,.85)';ctx.lineWidth=2.5;
      ctx.strokeRect(P0.x-hw,P0.y-hh,hw*2,hh*2);ctx.restore();
    }
    if(onion){
      if(cur>0)drawFrame(ctx,frames[cur-1],'#FF5A4D',.3);
      if(cur<frames.length-1)drawFrame(ctx,frames[cur+1],'#1DB37A',.22);
    }
    drawFrame(ctx,frames[cur]);
    if(ftpl(frames[cur]))drawPic(ctx,ftpl(frames[cur]),null,false);
    texts.forEach(function(T,i){drawText(ctx,T,null,null,-1,i);});
    if(tool==='text'&&sel>=0&&texts[sel]){
      var B=textBox(texts[sel]);
      ctx.save();ctx.setLineDash([8,6]);ctx.strokeStyle='rgba(43,89,255,.85)';ctx.lineWidth=2.5;
      ctx.strokeRect(B.x0-12,B.y0-8,B.w+24,B.y1-B.y0+16);ctx.restore();
    }
    faces.forEach(function(F){drawFace(ctx,null,{blink:0,smile:.3,lx:0,ly:.2},F);});
    if(tool==='face'&&mode==='draw'&&curFace()){
      var SF=curFace(),rr=faceR(SF);
      ctx.save();ctx.setLineDash([8,6]);ctx.strokeStyle='rgba(43,89,255,.85)';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(SF.x,SF.y-(SF.k==='ojos'?0:20*SF.s),rr,0,6.2832);ctx.stroke();ctx.restore();
    }
    if(lasso&&lasso.length>1){
      ctx.save();ctx.setLineDash([10,7]);ctx.lineWidth=3;ctx.strokeStyle='rgba(43,89,255,.95)';ctx.fillStyle='rgba(43,89,255,.12)';
      ctx.beginPath();lasso.forEach(function(q,i){if(i)ctx.lineTo(q[0],q[1]);else ctx.moveTo(q[0],q[1]);});
      ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
    }
  }

  /* ---------- live animation ---------- */
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function renderLive(dt){
    paper();
    if(!bb)return;
    var ts=tLive*speed,n=frames.length;
    var idx=n>1&&cycleOn?((Math.floor(ts/frameDur)%n)+n)%n:Math.min(cur,n-1);
    if(idx!==lastIdx||$('fidx').hidden===(n>1&&cycleOn)){
      lastIdx=idx;var fi=$('fidx');
      if(n>1&&cycleOn){fi.hidden=false;fi.textContent='Escena '+(idx+1)+' de '+n;}else fi.hidden=true;
    }
    drawBg(ctx,frames[idx]);
    var bx=(bb.minX+bb.maxX)/2,by=bb.maxY,cx=bx;
    var hh=Math.max(1,bb.maxY-bb.minY),ww=bb.maxX-bb.minX;
    var sx=1,sy=1,rot=0,bend=0,spin=1,dx=0,dy=0,wA=0,wf=0,lift=0,b;
    if(fx==='respirar'){
      b=Math.sin(ts*6.2832/2.6);sy=1+.045*b;sx=1-.028*b;bend=.25*Math.sin(ts*6.2832/5.2);
    }else if(fx==='saltar'){
      var P=1.15,ph=(ts%P)/P;
      if(ph<.8){var a=Math.sin(Math.PI*ph/.8);dy=-a*Math.min(hh*.3,240);sy=1+.1*a;sx=1-.06*a;lift=a;}
      else{var q=Math.sin(Math.PI*(ph-.8)/.2);sy=1-.18*q;sx=1+.12*q;}
    }else if(fx==='bailar'){
      b=Math.sin(ts*6.2832/1.3);bend=b*1.1;rot=.05*Math.sin(ts*6.2832/1.3+.6);
      dy=-Math.abs(b)*hh*.035;sy=1+.03*Math.cos(ts*12.566/1.3);lift=Math.abs(b)*.5;
    }else if(fx==='ondas'){
      wA=11;wf=ts*3.4;
    }else if(fx==='girar'){
      spin=Math.cos(ts*6.2832/3.2);dy=-Math.abs(Math.sin(ts*6.2832/3.2))*10;
    }else if(fx==='seguir'){
      if(dt>0){
        var k=1-Math.exp(-dt*3),ddx=(fol.tx-fol.ox)*k,ddy=(fol.ty-fol.oy)*k;
        fol.ox+=ddx;fol.oy+=ddy;fol.vx=ddx/dt;
        var spd=Math.hypot(ddx,ddy)/dt;
        fol.mv+=(Math.min(1,spd/240)-fol.mv)*(1-Math.exp(-dt*8));
        if(Math.abs(fol.vx)>50)fol.faceT=fol.vx>0?1:-1;
        fol.face+=(fol.faceT-fol.face)*(1-Math.exp(-dt*10));
      }
      var mv=fol.mv,hop=Math.abs(Math.sin(ts*10))*mv;
      spin=fol.face;dx=fol.ox;dy=fol.oy-hop*26;lift=hop;
      sy=1+.07*Math.sin(ts*20)*mv+.035*Math.sin(ts*2.4)*(1-mv);sx=1-(sy-1)*.6;
      rot=clamp(fol.vx/2200,-.2,.2)*mv;
    }
    var bt=(performance.now()-boingAt)/1000;
    if(bt<1.2){var bo=-Math.exp(-bt*5)*Math.cos(bt*20)*.16;sy+=bo;sx-=bo*.7;}

    var gx=bx+(fx==='seguir'?fol.ox:0),gy=by+(fx==='seguir'?fol.oy:0);
    var sr=Math.max(ww*.4,50)*(.65+.35*Math.abs(spin))*(1-.35*lift);
    ctx.fillStyle='rgba(20,28,50,'+(.14*(1-.4*lift)).toFixed(3)+')';
    if(fx!=='none'){ctx.beginPath();ctx.ellipse(gx,gy+4,sr,Math.max(8,sr*.14),0,0,6.2832);ctx.fill();}

    var map=function(x,y){
      x=cx+(x-cx)*spin;
      var rx=(x-bx)*sx,ry=(y-by)*sy;
      if(bend){var f=clamp(-ry/hh,0,1);rx+=bend*Math.pow(f,1.6)*hh*.16;}
      if(rot){var c=Math.cos(rot),s=Math.sin(rot),t=rx*c-ry*s;ry=rx*s+ry*c;rx=t;}
      var X=bx+rx+dx,Y=by+ry+dy;
      if(wA){X+=wA*Math.sin(y*.022+wf);Y+=wA*.55*Math.sin(x*.018+wf*.8);}
      M.x=X;M.y=Y;
    };
    var tk=boil?Math.floor(ts*9):-1;
    pics.forEach(function(P){drawPic(ctx,P,map,false);});
    drawFrame(ctx,frames[idx],null,1,map,tk);
    if(ftpl(frames[idx]))drawPic(ctx,ftpl(frames[idx]),map,false);
    texts.forEach(function(T,i){drawText(ctx,T,map,revealAt(T,ts,i),tk,i);});
    faces.forEach(function(face,fi){
      map(face.x,face.y);var wx=M.x,wy=M.y;
      var es=face.es||(face.es={x:0,y:0});
      var ph=ts+fi*.7;
      var st={blink:0,smile:smileOn?.2+.8*(.5-.5*Math.cos(ph*6.2832/2.6)):.18,lx:0,ly:0};
      if(smileOn&&bt<1.4)st.smile=Math.max(st.smile,Math.exp(-bt*1.4));
      var bph=(ts+fi*1.1)%3.3;if(bph<.18)st.blink=Math.sin(Math.PI*bph/.18);
      var tx=0,ty=0,since=(performance.now()-ptr.t)/1000,spd2=7;
      if(eyesOn){
        if(since<2.5){
          var vx=ptr.x-wx,vy=ptr.y-wy,mm=Math.hypot(vx,vy)||1,k2=Math.min(1,mm/200);
          tx=vx/mm*k2;ty=vy/mm*k2;spd2=14;
        }else{
          var kk=Math.floor(ts/1.3)+fi*5;
          tx=(rnd(kk,1.1,2.2)-.5)*1.9;ty=(rnd(kk,3.3,4.4)-.5)*1.2;
        }
      }
      var ke=1-Math.exp(-dt*spd2);
      es.x+=(tx-es.x)*ke;es.y+=(ty-es.y)*ke;
      st.lx=es.x;st.ly=es.y;
      drawFace(ctx,map,st,face);
    });
  }
  function loop(now){
    if(mode!=='live')return;
    var dt=clamp((now-lastT)/1000,0,.05);lastT=now;
    if(playing)tLive+=dt;
    try{renderLive(playing?dt:0);}catch(err){}
    raf=requestAnimationFrame(loop);
  }

  /* ---------- layout ---------- */
  function fit(){
    var aw=stage.clientWidth-24,ah=stage.clientHeight-24-26-(full?72:0);
    scale=Math.max(.1,Math.min(aw/W,ah/H));
    dpr=Math.min(window.devicePixelRatio||1,3);
    cv.style.width=(W*scale)+'px';cv.style.height=(H*scale)+'px';
    setRes(true);clampPan();applyView();
  }
  function setRes(force){
    var k0=scale*dpr,cap=Math.max(k0,Math.min(3600/H,2800/W)),nk=Math.max(k0,Math.min(k0*zoom,cap));
    if(!force&&Math.abs(nk-rk)<.01&&cv.width===Math.round(W*nk))return;
    rk=nk;cv.width=Math.round(W*rk);cv.height=Math.round(H*rk);
    if(mode==='live')renderLive(0);else render();
  }
  var shT=0;function sharpen(){clearTimeout(shT);shT=setTimeout(function(){setRes(false);},140);}
  function clampPan(){
    if(zoom<=1.001){panX=0;panY=0;return;}
    var mx=(zoom-1)*$('sheet').offsetWidth/2+Math.min(80,stage.clientWidth*.2),my=(zoom-1)*$('sheet').offsetHeight/2+Math.min(80,stage.clientHeight*.2);
    panX=clamp(panX,-mx,mx);panY=clamp(panY,-my,my);
  }
  function applyView(){
    $('sheet').style.transform=(zoom===1&&!panX&&!panY)?'':'translate('+panX.toFixed(1)+'px,'+panY.toFixed(1)+'px) scale('+zoom.toFixed(3)+')';
    $('z-reset').textContent=Math.round(zoom*100)+'%';
  }
  function zoomBtn(f){

  function isLine(d){var c=0;for(var i=0;i<d.length;i+=4)if(.3*d[i]+.59*d[i+1]+.11*d[i+2]>215)c++;return c/(d.length>>2)>=.86;}
  function blur3(P,w,h){
    var T=new Float32Array(P.length),x,y,k,a,l,r,u,dn;
    for(y=0;y<h;y++)for(x=0;x<w;x++){k=y*w+x;a=P[k];l=x>0?P[k-1]:a;r=x<w-1?P[k+1]:a;T[k]=(l+a+r)/3;}
    for(y=0;y<h;y++)for(x=0;x<w;x++){k=y*w+x;a=T[k];u=y>0?T[k-w]:a;dn=y<h-1?T[k+w]:a;P[k]=(u+a+dn)/3;}
  }
  function edgeAlpha(d,w,h,lvl){
    var n=w*h,mag=new Float32Array(n),ch,i,x,y,k;
    for(ch=0;ch<3;ch++){
      var P=new Float32Array(n);for(i=0;i<n;i++)P[i]=d[i*4+ch];
      blur3(P,w,h);
      for(y=1;y<h-1;y++)for(x=1;x<w-1;x++){
        k=y*w+x;
        var gx=P[k-w+1]+2*P[k+1]+P[k+w+1]-P[k-w-1]-2*P[k-1]-P[k+w-1],
            gy=P[k+w-1]+2*P[k+w]+P[k+w+1]-P[k-w-1]-2*P[k-w]-P[k-w+1],
            m=Math.sqrt(gx*gx+gy*gy);
        if(m>mag[k])mag[k]=m;
      }
    }
    var t=260-lvl*2.3,A=new Uint8Array(n),B;
    for(i=0;i<n;i++)A[i]=mag[i]>t?255:0;
    B=A.slice();
    for(y=1;y<h-1;y++)for(x=1;x<w-1;x++){k=y*w+x;if(!A[k]&&(A[k-1]||A[k+1]||A[k-w]||A[k+w]))B[k]=255;}
    return B;
  }
  function lineify(img,lc,max,lvl){
    var sc=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*sc)),h=Math.max(1,Math.round(img.height*sc));
    var c=document.createElement('canvas');c.width=w;c.height=h;var g=c.getContext('2d');
    g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);
    var id=g.getImageData(0,0,w,h),d=id.data,r=parseInt(lc.slice(1,3),16),gg=parseInt(lc.slice(3,5),16),b=parseInt(lc.slice(5,7),16);
    var edge=lvl>0&&!isLine(d),ea=edge?edgeAlpha(d,w,h,lvl):null;lastEdge=edge;
    for(var i=0;i<d.length;i+=4){
      var l=.3*d[i]+.59*d[i+1]+.11*d[i+2];
      d[i]=r;d[i+1]=gg;d[i+2]=b;d[i+3]=edge?ea[i>>2]:clamp((235-l)*2.4,0,255);
    }
    g.putImageData(id,0,0);
    var P={c:c,x:W/2,y:H/2,s:1,undo:[]};
    if(!trimPic(P))return null;
    P.s=Math.min(820/P.c.width,1040/P.c.height);P.x=W/2;P.y=H*.5;
    return P;
  }
  function setTpl(P){
    tpl=P;buildStrip();view();
    clearTimeout(tplT);
    tplT=setTimeout(function(){
      try{
        if(!tpl)localStorage.removeItem(TK);
        else localStorage.setItem(TK,JSON.stringify({d:tpl.c.toDataURL('image/png'),s:tpl.s,x:tpl.x,y:tpl.y}));
      }catch(e){}
    },500);
  }
  function applyFig(P,keep){
    if(!P){say('No encontré líneas en esa imagen. Usa un contorno oscuro sobre fondo claro.',3200);return;}
    if(exampleOn){exampleOn=false;frames=[newFrame()];cur=0;texts=[];faces=[];fsel=-1;}
    setTpl(P);setTool(keep?'gal':'fill');
    say('Elige un color y toca dentro de cada zona para pintarla.',3600);
  }
  function useFig(f){
    var im=new Image();
    im.onload=function(){applyFig(lineify(im,f.lc,900));};
    im.onerror=function(){say('No pude abrir la figura.',2400);};
    im.src=f.u;
  }
  function saveFigs(){try{localStorage.setItem(FK,JSON.stringify(mine));}catch(e){say('No hay espacio para guardar más figuras.',2600);}}
  function buildGal(){
    var box=$('galchips');box.textContent='';
    function card(n,src,fn){
      var b=document.createElement('button');b.type='button';b.className='gal';b.setAttribute('aria-label',n);
      var im=document.createElement('img');im.src=src;im.alt='';
      var s=document.createElement('span');s.textContent=n;
      b.appendChild(im);b.appendChild(s);b.addEventListener('click',fn);box.appendChild(b);
    }
    FIGS.forEach(function(f){card(f.n,f.u,function(){useFig(f);});});
    mine.forEach(function(o,i){card(o.n||'Mía '+(i+1),o.d,function(){fromData(o.d,applyFig);});});
  }
  function loadGal(){
    try{
      var a=JSON.parse(localStorage.getItem(FK)||'[]');
      if(Array.isArray(a))mine=a.filter(function(o){return o&&typeof o.d==='string'&&o.d.indexOf('data:image/png')===0;}).slice(0,5);
    }catch(e){}
    try{
      var t=JSON.parse(localStorage.getItem(TK)||'null');
      if(t&&typeof t.d==='string'&&t.d.indexOf('data:image/png')===0){
        fromData(t.d,function(P){P.s=clamp(+t.s||P.s,.1,3);P.x=+t.x||W/2;P.y=+t.y||H/2;tpl=P;buildStrip();view();});
      }
    }catch(e){}
    buildGal();
  }
  function snapshot(){
    var c=document.createElement('canvas');c.width=W;c.height=H;
    var g=c.getContext('2d');g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.fillStyle='#fff';g.fillRect(0,0,W,H);
    drawBg(g,frames[cur]);
    pics.forEach(function(P){drawPic(g,P,null,false);});
    drawFrame(g,frames[cur]);
    if(ftpl(frames[cur]))drawPic(g,ftpl(frames[cur]),null,false);
    texts.forEach(function(T,i){drawText(g,T,null,null,-1,i);});
    faces.forEach(function(F){drawFace(g,null,{blink:0,smile:.3,lx:0,ly:.2},F);});
    return c;
  }
  function savePng(quiet){
    snapshot().toBlob(function(b){
      if(!b){say('No pude crear la imagen.',2200);return;}
      var a=document.createElement('a'),u=URL.createObjectURL(b);
      a.href=u;a.download='dibujo-vivo.png';document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(u);},4000);
      if(!quiet)say('Dibujo descargado como imagen PNG.',2600);
    },'image/png');
  }
  function shareImg(){
    snapshot().toBlob(function(b){
      if(!b){say('No pude crear la imagen.',2200);return;}
      var f=new File([b],'dibujo-vivo.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[f]})){
        navigator.share({files:[f],title:'Dibujo Vivo',text:'Mira mi dibujo hecho en Dibujo Vivo'}).catch(function(){});
      }else{
        savePng(true);say('Este navegador no comparte directo. Se descargó la imagen para que la envíes.',3600);
      }
    },'image/png');
  }
  $('t-gal').addEventListener('click',function(){
    setTool('gal');
    say('Elige una figura para pintar, o sube la tuya.',2800);
  });
  $('edr').addEventListener('input',function(){
    edgeLvl=+this.value;$('edv').textContent=edgeLvl;
    if(!lastImg)return;
    clearTimeout(edT);
    edT=setTimeout(function(){var P=lineify(lastImg,'#15181F',800,edgeLvl);if(P)setTpl(P);},160);
  });
  $('edr').addEventListener('change',function(){
    if(!lastImg||!lastMine||mine.indexOf(lastMine)<0||!tpl)return;
    lastMine.d=tpl.c.toDataURL('image/png');saveFigs();buildGal();
  });
  $('b-save').addEventListener('click',function(){savePng(false);});
  $('b-share').addEventListener('click',shareImg);

  /* ---------- PDF: cada página se vuelve un cuadro con su propio contorno para pintar ---------- */
  var PDFV='3.11.174',PDFBASE='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/'+PDFV+'/',pdfReady=null;
  function loadPdfJs(){
    if(pdfReady)return pdfReady;
    pdfReady=new Promise(function(res,rej){
      if(window.pdfjsLib){res(window.pdfjsLib);return;}
      var sc=document.createElement('script');sc.src=PDFBASE+'pdf.min.js';
      sc.onload=function(){
        var L=window.pdfjsLib;
        if(!L){rej(new Error('pdf.js no cargó'));return;}
        fetch(PDFBASE+'pdf.worker.min.js').then(function(r){return r.text();}).then(function(t){
          L.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([t],{type:'text/javascript'}));res(L);
        }).catch(function(){L.GlobalWorkerOptions.workerSrc=PDFBASE+'pdf.worker.min.js';res(L);});
      };
      sc.onerror=function(){rej(new Error('Sin conexión para cargar el lector de PDF'));};
      document.head.appendChild(sc);
    });
    pdfReady.catch(function(){pdfReady=null;});
    return pdfReady;
  }
  var pdfBusy=false;
  function importPdf(file){
    if(pdfBusy)return;
    pdfBusy=true;say('Abriendo PDF…');
    var lib,doc;
    loadPdfJs().then(function(L){lib=L;return file.arrayBuffer();})
    .then(function(ab){return lib.getDocument({data:ab}).promise;})
    .then(function(d){
      doc=d;
      var blankOnly=exampleOn||(frames.length===1&&!frames[0].strokes.length&&!ftpl(frames[0]));
      var room=blankOnly?MAXF:MAXF-frames.length;
      if(room<=0){say('No hay espacio: ya tienes '+MAXF+' cuadros. Borra alguno e inténtalo de nuevo.',3600);pdfBusy=false;return;}
      var n=Math.min(doc.numPages,room),pages=[],i=0;
      function next(){
        if(i>=n)return Promise.resolve();
        var pn=++i;say('Preparando página '+pn+' de '+n+'…');
        return doc.getPage(pn).then(function(pg){
          var v0=pg.getViewport({scale:1}),sc=Math.min(3,1100/Math.max(v0.width,v0.height)),v=pg.getViewport({scale:sc});
          var c=document.createElement('canvas');c.width=Math.max(1,Math.round(v.width));c.height=Math.max(1,Math.round(v.height));
          var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
          return pg.render({canvasContext:g,viewport:v}).promise.then(function(){
            var P=null;try{P=lineify(c,'#15181F',1000,edgeLvl);}catch(err){}
            pages.push(P||false);
            return new Promise(function(r){setTimeout(r,0);});
          });
        }).then(next);
      }
      return next().then(function(){
        if(exampleOn){exampleOn=false;texts=[];faces=[];fsel=-1;}
        if(blankOnly)frames=[];
        var start=frames.length;
        pages.forEach(function(P){var f=newFrame();f.tpl=P;frames.push(f);});
        cur=start;
        buildStrip();setTool('fill');render();saveSoon();
        var extra=doc.numPages>n?' Se cargaron las primeras '+n+' (máximo de cuadros).':'';
        say('PDF listo: '+n+' página'+(n>1?'s':'')+'. Pinta una y cambia de página en la tira de abajo.'+extra,5200);
        pdfBusy=false;
      });
    }).catch(function(err){
      pdfBusy=false;
      say('No pude abrir el PDF: '+(err&&err.message?err.message:'error desconocido'),4200);
    });
  }
  $('g-pdf').addEventListener('click',function(){$('pdffile').click();});
  $('pdffile').addEventListener('change',function(){
    var f=this.files&&this.files[0];var inp=this;setTimeout(function(){inp.value='';},3000);
    if(f)importPdf(f);
  });
  $('g-up').addEventListener('click',function(){$('gfile').click();});
  $('gfile').addEventListener('change',function(){
    var f=this.files&&this.files[0];setTimeout(function(){$('gfile').value='';},3000);
    if(!f)return;
    var url=URL.createObjectURL(f),im=new Image();
    im.onload=function(){
      URL.revokeObjectURL(url);
      lastImg=im;var P=null;try{P=lineify(im,'#15181F',800,edgeLvl);}catch(err){say('No pude procesar esa imagen: '+err.message,4200);return;}
      if(P){
        lastMine={n:'Mía',d:P.c.toDataURL('image/png')};mine.unshift(lastMine);mine=mine.slice(0,5);saveFigs();buildGal();
      }
      applyFig(P,lastEdge);
      if(P&&lastEdge)say('Convertí tu imagen a contorno. Ajusta el detalle y luego toca el balde para pintar.',4600);
    };
    im.onerror=function(){URL.revokeObjectURL(url);say('No pude abrir esa imagen.',2500);};
    im.src=url;
  });
  $('g-off').addEventListener('click',function(){
    var fo=frames[cur];
    if(fo&&fo.tpl){fo.tpl=false;buildStrip();view();say('Figura de esta página quitada.',1800);return;}
    if(!tpl){say('No hay figura puesta.',1600);return;}
    setTpl(null);say('Figura quitada.',1600);
  });
  $('g-clr').addEventListener('click',function(){
    if(!mine.length){say('No tienes figuras subidas.',1600);return;}
    mine=[];saveFigs();buildGal();say('Figuras subidas borradas.',1800);
  });

  /* ---------- start ---------- */
  load();
  loadPics();
  loadGal();
  setFx(fx);
  markFaceKind();
  if(document.fonts&&document.fonts.load){
    document.fonts.load('700 48px Caveat').then(function(){if(mode==='live')renderLive(0);else render();},function(){});
  }
  buildStrip();
  if(exampleOn)say('Dibujo de ejemplo. Toca el bote de basura para empezar el tuyo.');
  fit();
})();
</script>
